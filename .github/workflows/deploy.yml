name: Build Deploy Branch

# Builds the theme on every push to main and publishes the production-ready
# files (build/ included, src/ and dev files excluded via .distignore, checked
# by .github/scripts/verify-dist.sh) to the `deploy` branch, then pings
# Deployer for Git on https://brilliantinsur.1wp.site, which reinstalls the
# `brilliant-insurance` theme from that branch.

on:
    push:
        branches:
            - main
        # Docs and AI instructions never ship, so changing only them doesn't deploy.
        paths-ignore:
            - '**.md'
            - '.claude/**'
    workflow_dispatch:

concurrency:
    group: deploy-branch
    cancel-in-progress: true

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build theme
              run: npm run build

            - name: Prepare deploy files
              run: |
                  mkdir -p "$RUNNER_TEMP/brilliant-insurance"
                  rsync -rc --exclude-from='.distignore' . "$RUNNER_TEMP/brilliant-insurance/"
                  find "$RUNNER_TEMP/brilliant-insurance" -name ".DS_Store" -type f -delete

            - name: Verify deploy files are clean
              run: bash .github/scripts/verify-dist.sh "$RUNNER_TEMP/brilliant-insurance"

            - name: Push to deploy branch
              env:
                  COMMIT_MSG: ${{ github.event.head_commit.message || 'manual run' }}
              run: |
                  cd "$RUNNER_TEMP/brilliant-insurance"
                  git init -q -b deploy
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -A
                  git commit -q -m "Deploy ${GITHUB_SHA::7}: ${COMMIT_MSG%%$'\n'*}"
                  git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" deploy

            # Deployer downloads the branch as a zip. Right after a push GitHub
            # can still serve the previous zip for a short while, so wait until
            # the deploy branch's zipball contains the commit just pushed
            # before pinging Deployer (otherwise it reinstalls the old version).
            - name: Wait for the new deploy zip
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  sha=$(git -C "$RUNNER_TEMP/brilliant-insurance" rev-parse --short=7 HEAD)
                  for i in $(seq 1 24); do
                      # The zip's root folder is "<owner>-<repo>-<short sha>/".
                      root=$(curl -sSL -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/${{ github.repository }}/zipball/deploy" 2>/dev/null | head -c 400 | LC_ALL=C grep -a -o -- '-[0-9a-f]\{7\}/' | head -1 || true)
                      case "$root" in *"$sha"*) echo "Deploy zip is at $sha"; exit 0;; esac
                      sleep 5
                  done
                  echo "::warning::Deploy zip not confirmed at $sha after 2 minutes; pinging Deployer anyway"

            - name: Notify Deployer for Git
              env:
                  DEPLOYER_WEBHOOK_URL: ${{ secrets.DEPLOYER_WEBHOOK_URL }}
              if: ${{ env.DEPLOYER_WEBHOOK_URL != '' }}
              run: curl -fsS -X POST "$DEPLOYER_WEBHOOK_URL"
